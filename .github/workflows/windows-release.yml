name: Windows x64 Release

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Attach the verified installer to a draft release for the selected version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-x64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64 tests and NSIS
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Restore shared Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          shared-key: windows-x64
          key: gameflow-10-2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Baseline check
        run: pnpm check:baseline

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript and ESLint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Dependency audit
        run: |
          pnpm audit
          pnpm audit --prod

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Windows check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Rust Windows tests (LCU Mock, no real client)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      # tauri.ci.conf.json changes only the beforeBuildCommand to a single Vite build.
      # Tests/typecheck/lint already ran above; this avoids a second frontend build.
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Missing TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }

      - name: Build Tauri NSIS with signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.ci.conf.json -- --locked

      - name: Prepare NSIS artifact and SHA-256
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (-not (Test-Path $bundlePath)) { throw "NSIS bundle directory not found: $bundlePath" }
          $installer = Get-ChildItem -Path $bundlePath -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found in $bundlePath" }

          $artifact = "aram-mayhem-windows-x64-setup.exe"
          Copy-Item $installer.FullName $artifact
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path $signature)) { throw "Updater signature is missing" }
          Copy-Item $signature "$artifact.sig"
          $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $artifact).Length
          "$hash  $artifact" | Out-File -FilePath "windows-installer.sha256" -Encoding ascii

          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @"
          ### Windows NSIS artifact
          - Source installer: `$($installer.Name)`
          - Size: `$size` bytes
          - SHA-256: `$hash`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Verify updater signature and generate manifest
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -match '-rc\.[1-9][0-9]*$') {
            node scripts/updater-artifacts.mjs . --prerelease
          } else {
            node scripts/updater-artifacts.mjs .
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aram-mayhem-windows-x64
          path: |
            aram-mayhem-windows-x64-setup.exe
            windows-installer.sha256
            aram-mayhem-windows-x64-setup.exe.sig
            latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Install and start the app on Windows
        shell: pwsh
        run: |
          $installer = (Resolve-Path "aram-mayhem-windows-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "aram-mayhem-smoke"
          $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -PassThru
          if (-not $setup.WaitForExit(120000)) {
            Stop-Process -Id $setup.Id -Force
            throw "NSIS silent install exceeded 120 seconds"
          }
          if ($setup.ExitCode -ne 0) { throw "NSIS install failed with code $($setup.ExitCode)" }
          $binary = Join-Path $installDir "aram-mayhem.exe"
          if (-not (Test-Path $binary)) { throw "Installed application is missing: $binary" }
          $app = Start-Process -FilePath $binary -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)" }
            "NSIS installed and the application stayed running for 8 seconds on Windows." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

  draft:
    name: Prepare a GitHub draft release
    if: inputs.draft_release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aram-mayhem-windows-x64
          path: installer
      - name: Verify tag and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Select the existing v$version tag before requesting a draft release." >&2
            exit 1
          fi
          cd installer
          tr -d '\r' < windows-installer.sha256 | sha256sum --check
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            "${release_flags[@]}" \
            aram-mayhem-windows-x64-setup.exe windows-installer.sha256 aram-mayhem-windows-x64-setup.exe.sig latest.json
