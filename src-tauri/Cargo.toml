[package]
name = "aram-mayhem"
version = "0.1.2"
description = "ARAM: Mayhem desktop shell"
authors = ["ARAM: Mayhem"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "aram_mayhem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
async-trait = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
native-tls = "0.2.18"
base64 = "0.23.1"
futures-util = "0.3"
tauri-plugin-autostart = "2"
semver = "1"
getrandom = "0.4"
tempfile = "3"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
